name: Canary build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: canary-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release-key.jks

      - name: Write local.properties
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          cat > local.properties <<EOF
          RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD
          RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD
          TELEGRAM_API_ID=$TELEGRAM_API_ID
          TELEGRAM_API_HASH=$TELEGRAM_API_HASH
          EOF

      - name: Set build metadata
        id: vars
        env:
          # Canary versionCode = base + run number, so it always increases across nightly builds
          # and always outranks any hand-versioned Release build (small integers, bumped rarely).
          CANARY_VERSION_CODE_BASE: 100000
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version_code=$((CANARY_VERSION_CODE_BASE + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Build canary APKs
        run: ./gradlew assembleCanary --no-daemon -PappVersionCode=${{ steps.vars.outputs.version_code }}

      # softprops/action-gh-release does not overwrite assets on an existing tag,
      # so drop the previous "canary" release/tag before publishing the new one.
      - name: Remove previous canary release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete canary --yes --cleanup-tag || true

      - name: Publish canary release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: canary
          name: Canary build ${{ steps.vars.outputs.sha_short }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            <!-- versionCode: ${{ steps.vars.outputs.version_code }} -->
            Automated build from `${{ steps.vars.outputs.sha_short }}` on `main`. Not for production use.
          files: app/build/outputs/apk/canary/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
